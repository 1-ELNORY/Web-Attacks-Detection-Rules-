title: Django ORM SQLi - Q() Object Injection
id: a1f2b3c4-d5e6-7890-abcd-ef1234567890
status: experimental
description: >
  Detects Django ORM SQL injection attempts targeting the _connector parameter
  via crafted URL. Possible Q() object injection leading to logic bypass or data exfiltration.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri|contains:
      - '_connector='
      - ')_connector='
  condition: selection
falsepositives:
  - Legitimate Django ORM queries using connector parameters in development environments
level: high
