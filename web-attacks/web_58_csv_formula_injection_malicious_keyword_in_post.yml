title: CSV / Formula Injection - Malicious Spreadsheet Keyword in POST Request
id: e7f8a9b0-c1d2-3456-efab-567890123456
status: experimental
description: >
  Detects formula injection payloads (CMD, HYPERLINK, DDE, IMPORTXML, PowerShell,
  mshta, certutil) with formula trigger characters (=, +, -, @, |) in POST request
  bodies. Executing exported data in Excel/LibreOffice can trigger command execution.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.execution
  - attack.initial_access
  - attack.t1059
  - attack.t1190
logsource:
  category: webserver
detection:
  selection_method:
    cs-method: POST
  selection_keywords:
    cs-uri|contains:
      - '=CMD'
      - '=HYPERLINK'
      - '=DDE'
      - '=IMPORTXML'
      - '=IMPORTHTML'
      - '=WEBSERVICE'
      - '=INDIRECT'
      - '=mshta'
      - '=PowerShell'
      - '=wscript'
      - '=cscript'
      - '=certutil'
      - '+CMD'
      - '-CMD'
      - '@CMD'
      - '|CMD'
  condition: selection_method and selection_keywords
falsepositives:
  - Legitimate data submissions that happen to include spreadsheet function names as strings
level: high
