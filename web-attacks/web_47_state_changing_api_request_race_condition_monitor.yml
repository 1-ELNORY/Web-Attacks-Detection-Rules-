title: State-Changing API Request Monitor - Race Condition Indicator
id: f6a7b8c9-d0e1-2345-fabc-456789012345
status: experimental
description: >
  Detects individual state-changing requests to financial/transactional API endpoints
  (checkout, withdraw, redeem). High frequency from the same IP within seconds indicates
  a race condition double-spend or duplicate-action attack.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri|contains:
      - '/api/v1/checkout'
      - '/api/v1/withdraw'
      - '/api/v1/redeem'
  condition: selection
falsepositives:
  - Legitimate retry logic in payment gateways under high load
level: low
