title: Password Reset Token Request Detected
id: d0e1f2a3-b4c5-6789-defa-890123456789
status: experimental
description: >
  Detects password or forgot-password reset requests containing a token/uuid/key
  parameter of 20+ characters in the URL. Serves as a monitor for subsequent
  brute-force token enumeration detection.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.credential_access
  - attack.t1589
logsource:
  category: webserver
detection:
  selection_uri:
    cs-uri|contains:
      - 'reset-password'
      - 'reset_password'
      - 'forgot-password'
      - 'forgot_password'
      - 'change-password'
      - 'password-reset'
  selection_token:
    cs-uri|contains:
      - 'token='
      - 'uuid='
      - 'key='
      - 'auth='
      - 'code='
  condition: selection_uri and selection_token
falsepositives:
  - Legitimate password reset flows initiated by the user themselves
level: low
