title: Blind SSRF via DNS Callback - Known OOB Interaction Domain in URL
id: e5f6a7b8-c9d0-1234-efab-345678901234
status: experimental
description: >
  Detects URLs containing well-known Out-of-Band (OOB) interaction domains used to
  confirm blind SSRF: Burp Collaborator, interactsh, oastify, canarytokens, requestbin,
  webhook.site, and dnslog variants. Indicates active SSRF probing.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.initial_access
  - attack.command_and_control
  - attack.t1190
  - attack.t1071.001
logsource:
  category: webserver
detection:
  selection:
    cs-uri|contains:
      - 'burpcollaborator.net'
      - 'oastify.com'
      - 'oast.live'
      - 'oast.site'
      - 'oast.online'
      - 'interact.sh'
      - 'canarytokens.com'
      - 'requestbin.net'
      - 'webhook.site'
      - 'dnslog.cn'
      - 'dnslog.io'
  condition: selection
falsepositives:
  - Authorized bug bounty or red team testing using OOB interaction platforms
level: high
