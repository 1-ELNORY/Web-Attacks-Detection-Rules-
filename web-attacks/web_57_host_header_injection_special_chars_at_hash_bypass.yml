title: Host Header Injection - Special Characters (@ or # Domain Bypass)
id: d6e7f8a9-b0c1-2345-defa-456789012345
status: experimental
description: >
  Detects @ or # special characters in X-Forwarded-Host, X-Host, or X-Forwarded-Server
  header values. These characters enable domain confusion or URL fragment bypass,
  allowing attackers to redirect traffic to attacker-controlled hosts.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri|re: '(?i)(X-Forwarded-Host|X-Host|X-Forwarded-Server)[^
]{1,253}[@#]'
  condition: selection
falsepositives:
  - OAuth redirect URIs that legitimately include @ in URL parameters
level: high
