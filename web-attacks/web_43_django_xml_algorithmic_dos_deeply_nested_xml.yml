title: Django XML Algorithmic DoS - Deeply Nested XML Payload
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: >
  Detects delivery of deeply nested XML payloads to Django XML/import/fixture endpoints.
  Deeply nested XML (50+ closing tags) causes algorithmic DoS via XML parser exhaustion.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.impact
  - attack.initial_access
  - attack.t1499.002
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri|contains:
      - '/api/import'
      - '/fixtures'
      - '/deserialize'
    cs-uri|endswith:
      - '.xml'
  condition: selection
falsepositives:
  - Legitimate bulk XML imports to authorized Django admin endpoints
level: high
