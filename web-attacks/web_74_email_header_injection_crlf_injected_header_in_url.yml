title: Email Header Injection - CRLF with Injected Email Header in URL
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: >
  Detects email header injection via URL-encoded CRLF characters (%0d%0a, %0a, %0d)
  followed by injected email headers (To, CC, BCC, From, Reply-To, X-Mailer,
  MIME-Version, Content-Transfer-Encoding) in the request URL. Enables spam relay,
  phishing, and email spoofing through the application mailer.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.initial_access
  - attack.impact
  - attack.t1190
  - attack.t1491
logsource:
  category: webserver
detection:
  selection_crlf:
    cs-uri|contains:
      - '%0d%0a'
      - '%0D%0A'
      - '%0a'
      - '%0A'
      - '%0d'
      - '%0D'
  selection_header:
    cs-uri|contains:
      - 'to:'
      - 'cc:'
      - 'bcc:'
      - 'from:'
      - 'reply-to:'
      - 'x-mailer:'
      - 'mime-version:'
      - 'content-transfer-encoding:'
  condition: selection_crlf and selection_header
falsepositives:
  - URL-encoded form submissions that legitimately include email header field names as data
level: high
