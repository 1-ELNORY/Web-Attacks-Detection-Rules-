title: Django SSRF - URLValidator Bypass via Encoded Newlines or Null Bytes
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: >
  Detects Django URLValidator bypass attempts using CRLF-encoded (%0d, %0a) or null-byte
  (%00) characters in redirect/callback/URL parameters. Enables Server-Side Request Forgery
  by escaping URL validation logic.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.initial_access
  - attack.credential_access
  - attack.t1190
  - attack.t1552.005
logsource:
  category: webserver
detection:
  selection_param:
    cs-uri|contains:
      - 'callback=http'
      - 'webhook=http'
      - 'redirect=http'
      - 'next=http'
      - 'url=http'
      - 'returnUrl=http'
      - 'forward=http'
  selection_encoded:
    cs-uri|contains:
      - '%0d'
      - '%0a'
      - '%00'
      - '%0D'
      - '%0A'
  condition: selection_param and selection_encoded
falsepositives:
  - Legitimate URL encoding in multi-step redirect flows
level: high
