title: XML Entity Bomb - Multiple Recursive ENTITY Definitions (Billion Laughs DoS)
id: d8e9f0a1-b2c3-4567-defa-678901234567
status: experimental
description: >
  Detects XML Entity Bomb (Billion Laughs) setup: 3 or more recursive ENTITY
  definitions (<!ENTITY a "&b;">) in a single request. When the XML parser expands
  these nested entities, memory consumption grows exponentially, causing server
  Denial of Service.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.impact
  - attack.initial_access
  - attack.t1499.002
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri|re: '(?i)(<!ENTITY\s+\w+\s+["']?&\w+;["']?\s*>.*){3,}'
  condition: selection
falsepositives:
  - XML applications that legitimately define multiple entity references for content reuse
level: high
