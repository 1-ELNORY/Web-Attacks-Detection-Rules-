title: gRPC Protocol Detection - Communication or Service Discovery Request
id: a9b0c1d2-e3f4-5678-abcd-789012345678
status: experimental
description: >
  Detects gRPC communication or service reflection/discovery requests.
  Attackers abuse gRPC Server Reflection to enumerate exposed RPC services
  and method signatures without authentication, enabling targeted exploitation.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.discovery
  - attack.reconnaissance
  - attack.t1046
  - attack.t1595
logsource:
  category: webserver
detection:
  selection:
    cs-uri|contains:
      - 'application/grpc'
      - 'grpc.reflection'
      - 'ServerReflectionInfo'
      - '.proto'
      - 'grpc-web'
      - 'grpc+proto'
  condition: selection
falsepositives:
  - Legitimate gRPC clients and microservices communicating over HTTP/2
level: high
