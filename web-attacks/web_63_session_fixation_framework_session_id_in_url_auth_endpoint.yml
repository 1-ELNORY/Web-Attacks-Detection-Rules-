title: Session Fixation - Framework Session ID Passed in URL on Auth Endpoint
id: d2e3f4a5-b6c7-8901-defa-012345678901
status: experimental
description: >
  Detects session fixation attacks where framework session identifiers
  (PHPSESSID, JSESSIONID, ASPSESSIONID, ASP.NET_SessionId, session_id) are
  passed as URL query parameters on authentication endpoints (login, SSO,
  OAuth, SAML). Attackers pre-set session IDs to hijack authenticated sessions.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.credential_access
  - attack.initial_access
  - attack.t1550.001
  - attack.t1190
logsource:
  category: webserver
detection:
  selection_sessionid:
    cs-uri|re: '(?i)(PHPSESSID|JSESSIONID|ASPSESSIONID|ASP\.NET_SessionId|session_id)=[a-zA-Z0-9\-_]{16,}'
  selection_authpath:
    cs-uri|contains:
      - '/login'
      - '/signin'
      - '/authenticate'
      - '/auth'
      - '/sso'
      - '/oauth'
      - '/saml'
  condition: selection_sessionid and selection_authpath
falsepositives:
  - Legacy applications that legitimately embed session IDs in URLs for compatibility
level: high
