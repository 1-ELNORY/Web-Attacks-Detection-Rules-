title: Critical CSV Injection - DDE Pipe-Cell Syntax (Potential RCE)
id: b0c1d2e3-f4a5-6789-bcde-890123456789
status: experimental
description: >
  Detects Dynamic Data Exchange (DDE) pipe-cell syntax in HTTP requests.
  This is the hallmark pattern of critical CSV injection: a formula followed
  by a pipe character and cell reference (=...| !A1) that triggers command
  execution in Microsoft Excel when the exported file is opened.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.execution
  - attack.initial_access
  - attack.t1059
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri|re: '(?i)(=|%3D|\+|%2B)[^&\s]{0,60}(\||%7C)[^&\s]{0,60}![A-Z]{1,3}[0-9]{1,7}'
  condition: selection
falsepositives:
  - Legitimate spreadsheet formula submissions in controlled data-entry applications
level: critical
