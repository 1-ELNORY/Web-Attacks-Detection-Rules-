title: Account Enumeration Attack - High-Frequency Auth Endpoint Scanning
id: a3b4c5d6-e7f8-9012-abcd-123456789012
status: experimental
description: >
  Detects account enumeration attacks: 10+ requests to authentication endpoints
  with user identifiers from the same source IP within 60 seconds.
  Indicates automated scanning to identify valid usernames or email addresses.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.reconnaissance
  - attack.t1589.002
logsource:
  category: webserver
detection:
  selection:
    cs-uri|contains:
      - '/auth/check-user'
      - '/signup'
      - '/forgot-password'
  timeframe: 60s
  condition: selection | count() by c-ip > 10
falsepositives:
  - Authorized load tests or stress tests against authentication endpoints
level: high
