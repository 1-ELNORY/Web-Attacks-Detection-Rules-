title: Password Reset Token Brute-Force - Rapid Token Enumeration
id: e1f2a3b4-c5d6-7890-efab-901234567890
status: experimental
description: >
  Detects brute-force abuse of password reset tokens: 5+ reset token attempts
  from the same source IP within 60 seconds. Indicates automated enumeration
  of one-time reset codes to hijack user accounts.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.credential_access
  - attack.t1110.001
  - attack.t1589
logsource:
  category: webserver
detection:
  selection:
    cs-uri|contains:
      - 'reset-password'
      - 'reset_password'
      - 'forgot-password'
  selection_token:
    cs-uri|contains:
      - 'token='
      - 'uuid='
      - 'key='
  timeframe: 60s
  condition: selection and selection_token | count() by c-ip > 5
falsepositives:
  - Automated testing pipelines for password reset flows in QA environments
level: high
