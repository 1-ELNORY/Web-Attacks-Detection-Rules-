title: API Mass Assignment - Privilege Parameter Injection
id: c9d0e1f2-a3b4-5678-cdef-789012345678
status: experimental
description: >
  Detects injection of sensitive privilege-escalation parameters (is_admin, admin,
  superuser, role=admin/root/owner, privilege_level) in API request bodies.
  Indicates a mass assignment attack to gain unauthorized elevated access.
references: []
author: Ahmed Elnoury
date: 2025/06/01
tags:
  - attack.privilege_escalation
  - attack.initial_access
  - attack.t1068
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-method: POST
    cs-uri|contains:
      - 'is_admin=true'
      - 'admin=true'
      - 'superuser=true'
      - 'isAdmin=true'
      - 'role=admin'
      - 'role=superuser'
      - 'role=root'
      - 'role=owner'
      - 'is_admin=1'
  condition: selection
falsepositives:
  - Internal admin tooling that sets privilege flags through backend-only APIs
level: critical
